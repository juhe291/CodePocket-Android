// Isolated local preflight; no App source/dependency graph is changed by this task.
gradle.projectsEvaluated {
    def app=gradle.rootProject.project(':app')
    def configuration=app.configurations.detachedConfiguration(
        app.dependencies.create('androidx.webkit:webkit:1.18.0'),
        app.dependencies.create('io.noties.markwon:core:4.6.2'))
    def base=app.configurations.getByName('debugRuntimeClasspath').attributes
    base.keySet().each { key->configuration.attributes.attribute(key,base.getAttribute(key)) }
    app.tasks.register('resolveWebCandidate') {
        doLast {
            def entries=configuration.resolvedConfiguration.resolvedArtifacts.collect { artifact->
                def digest=java.security.MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { stream->byte[] buffer=new byte[65536];int count
                    while((count=stream.read(buffer))>0)digest.update(buffer,0,count) }
                [module:artifact.moduleVersion.id.toString(),file:artifact.file.absolutePath,bytes:artifact.file.length(),sha256:digest.digest().encodeHex().toString()]
            }.sort { it.module }
            def output=new File(app.rootDir,'verification/web-sidebar-preflight-2026-11-03/resolved-candidates.json')
            output.text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries))+'\n'
            entries.each { println "WEB_CANDIDATE ${it.module} ${it.bytes} ${it.sha256}" }
        }
    }
}
