import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
gradle.projectsEvaluated {
    def app=gradle.rootProject.project(':app')
    app.tasks.register('recordWebDependencies') {
        doLast {
            def result=[:]
            ['debugCompileClasspath','debugRuntimeClasspath'].each { name ->
                def configuration=app.configurations.getByName(name)
                // Modern filtered artifact selection avoids ambiguous Android project artifact types.
                def view=configuration.incoming.artifactView { componentFilter { id -> id instanceof ModuleComponentIdentifier } }
                def artifacts=view.artifacts.artifacts.collect { artifact ->
                    def id=artifact.id.componentIdentifier
                    [coordinate:"${id.group}:${id.module}:${id.version}",file:artifact.file.absolutePath,
                     bytes:artifact.file.length(),sha256:MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()]
                }.sort { it.coordinate }
                ['androidx.webkit:webkit:1.18.0','io.noties.markwon:core:4.6.2','com.atlassian.commonmark:commonmark:0.13.0'].each { expected ->
                    assert artifacts.any { it.coordinate==expected }: "Missing fixed component: $expected"
                }
                def kotlin=artifacts.findAll { it.coordinate.startsWith('org.jetbrains.kotlin:kotlin-stdlib:') }
                assert kotlin.size()==1
                assert kotlin[0].coordinate.endsWith(name=='debugCompileClasspath' ? ':1.9.25' : ':2.1.21')
                result[name]=artifacts
            }
            def file=new File(gradle.rootProject.projectDir,'verification/app-updates-2026-11-03/actual-dependencies.json')
            file.text=JsonOutput.prettyPrint(JsonOutput.toJson(result))+'\n'
        }
    }
}
